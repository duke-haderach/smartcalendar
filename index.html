<style>
/* ===== EXACT VIEWPORT LOCK: 601px * 775px ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 601px;
  height: 775px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #f5f5f7;
  background-color: #1e1e1e;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  /* Fallback gradient ensures gorgeous background even if background.jpg returns 404 */
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364), url("background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
}

/* Locked Container Grid filling exact 601x775 */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 601px;
  height: 775px;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: brightness(0.85);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 6px;
  box-sizing: border-box;
  overflow: hidden;
}

/* macOS Frosted Glass Window Panel */
.macos-panel {
  background: rgba(30, 30, 30, 0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  padding: 6px 8px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

/* macOS Window Header dots */
.macos-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 3px;
  padding-bottom: 2px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.window-dots {
  display: flex;
  gap: 3px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }

.panel-title {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}

/* ===== LEFT COLUMN: Clock(20%), Weather(50%), Stock(30%) ===== */
.column-left {
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: 100%;
  min-width: 0;
}

.clock-panel {
  flex: 20%;
  align-items: center;
  text-align: center;
  justify-content: center;
}

#clock {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.1;
  color: #ffffff;
}

#date {
  font-size: 9px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 1px;

.weather-panel {
  flex: 50%;
  min-height: 0;
  overflow-y: auto;
}

#weather-current {
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  justify-content: space-between;

#weather-forecast {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.weather-day {

  justify-content: space-between;
  align-items: center;

.weather-day:hover {

.weather-name {

.weather-temp {

.weather-desc {

/* Hourly weather card size & container */

.hourly-row {

.stock-panel {

#tradingview-widget-container {

/* ===== RIGHT COLUMN: Quote(40%), Events(60%) ===== */

#thought-container {

.thought-label {

#thought-text {

.events-panel {

.auth-bar {

#auth-status {

.macos-btn {

.macos-btn:hover {

#events-container {

}

.event-item {

  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 4px;

}

.event-header-row {

.event-time-container {

.event-time {

.event-end-time {

.event-title {

.event-location {

<script>
// ===== CONFIGURATION =====
const CLIENT_ID = "703875968822-6ma5u7st5qm3eqgb1ktt9p52vs8knrb3.apps.googleusercontent.com";
const API_KEY = "AIzaSyCcx8q0nHP9DkA-M_KFyjFo-uLV-7TOrSE";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
const CALENDAR_ID = "family03331431524389313579@group.calendar.google.com";

const QUOTES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREcumm4p5A9G-506IZdhpDsBHZtbeHLiVMVbZJHLGFs6kkl3QPamiaOGmx1U8MADueTO-45bipj-wv/pub?output=csv";

let voiceEnabled = false;
let spokenEvents = new Set();
let cachedEvents = [];
let activeHourlyIndex = null;

// Global Error Guard to prevent screen blackouts
window.onerror = function(msg, url, line) {
  console.error("Global catch:", msg, "at", url, ":", line);
  return true;
};

// CSV Parser
function parseCSV(text) {
  try {
    const lines = text.split(/\r?\n/);
    return lines.map(line => {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    });
  } catch(e) {
    return [];
  }
}

function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

// Fetch today's thought with fallback
async function fetchAndDisplayTodayThought() {
  const fallbackQuote = `"Whatever the mind can conceive and believe, it can achieve." — Napoleon Hill`;
  try {
    const response = await fetch(QUOTES_CSV_URL);
    if (!response.ok) throw new Error("Network response failed");
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    
    if (rows.length < 2) throw new Error("Empty CSV");
    
    const now = new Date();
    const monthName = now.toLocaleString('en-US', { month: 'long' });
    const dayNum = now.getDate();
    const todayFormatted = `${monthName} ${dayNum}`;
    
    const dataRows = rows.slice(1).filter(r => r.length >= 2 && r[0]);
    let matchedRow = dataRows.find(r => r[0].toLowerCase() === todayFormatted.toLowerCase());
    
    if (!matchedRow) {
      const dayOfYear = getDayOfYear(now);
      const index = (dayOfYear - 1) % dataRows.length;
      matchedRow = dataRows[index];
    }
    
    if (matchedRow) {
      const dateCol = matchedRow[0];
      const principleCol = matchedRow[1] || '';
      const quoteCol = matchedRow[2] || matchedRow[1] || '';
      
      const titleElem = document.getElementById("thought-title");
      const textElem = document.getElementById("thought-text");
      
      if (titleElem && textElem) {
        titleElem.textContent = (principleCol && principleCol !== quoteCol) ? `${dateCol}: ${principleCol}` : `Napoleon Hill — ${dateCol}`;
        textElem.textContent = `"${quoteCol}"`;
      }
    } else {
      throw new Error("No match");
    }
  } catch (error) {
    console.warn("Using fallback quote:", error);
    const textElem = document.getElementById("thought-text");
    if (textElem) textElem.textContent = fallbackQuote;
  }
}

// ===== CLOCK & DATE =====
function updateClock() {
  const now = new Date();
  const clockEl = document.getElementById("clock");
  const dateEl = document.getElementById("date");
  if (clockEl) {
    clockEl.textContent = now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    });
  }
  if (dateEl) {
    dateEl.textContent = now.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });
  }
}

setInterval(updateClock, 1000);
updateClock();
fetchAndDisplayTodayThought();

// ===== DUAL TEMPERATURE FORMATTER (°C & °F) =====
function formatTempDual(tempC) {
  if (tempC === undefined || tempC === null || isNaN(tempC)) return "--°C / --°F";
  const c = Math.round(tempC);
  const f = Math.round((tempC * 9/5) + 32);
  return `${c}°C / ${f}°F`;
}

// ===== WEATHER LOGIC =====
const mockForecastData = [
  { name: "Today", tempC: 21, desc: "Sunny & Clear", hourly: generateTodayHourly(21) },
  { name: "Tomorrow", tempC: 23, desc: "Mostly Sunny", hourly: generateFull24HourHourly(23) },
  { name: "Wednesday", tempC: 19, desc: "Partly Cloudy", hourly: generateFull24HourHourly(19) },
  { name: "Thursday", tempC: 18, desc: "Light Showers", hourly: generateFull24HourHourly(18) },
  { name: "Friday", tempC: 20, desc: "Clear Skies", hourly: generateFull24HourHourly(20) },
  { name: "Saturday", tempC: 22, desc: "Warm & Sunny", hourly: generateFull24HourHourly(22) },
  { name: "Sunday", tempC: 17, desc: "Breezy", hourly: generateFull24HourHourly(17) }
];

function generateTodayHourly(baseTemp) {
  const hours = [];
  const currentHour = new Date().getHours();
  for (let hr = currentHour; hr < 24; hr++) {
    const ampm = hr >= 12 ? 'PM' : 'AM';
    const formattedHr = hr % 12 === 0 ? 12 : hr % 12;
    const tempVar = baseTemp + Math.round(Math.sin((hr / 24) * 2 * Math.PI) * 4);
    hours.push({ time: `${formattedHr} ${ampm}`, temp: tempVar });
  }
  return hours;
}

function generateFull24HourHourly(baseTemp) {
  const hours = [];
  for (let hr = 0; hr < 24; hr++) {
    const ampm = hr >= 12 ? 'PM' : 'AM';
    const formattedHr = hr % 12 === 0 ? 12 : hr % 12;
    const tempVar = baseTemp + Math.round(Math.sin((hr / 24) * 2 * Math.PI) * 4);
    hours.push({ time: `${formattedHr} ${ampm}`, temp: tempVar });
  }
  return hours;
}

function initWeather() {
  const currentEl = document.getElementById("weather-current");
  if (currentEl) {
    currentEl.innerHTML = `<span>Current</span> <span>${formatTempDual(21)} ☀️</span>`;
  }
  const forecastContainer = document.getElementById("weather-forecast");
  if (!forecastContainer) return;
  forecastContainer.innerHTML = "";
  
  mockForecastData.forEach((day, index) => {
    const dayDiv = document.createElement("div");
    dayDiv.className = "weather-day";
    dayDiv.innerHTML = `
      <span class="weather-name">${day.name}</span>
      <span class="weather-temp">${formatTempDual(day.tempC)}</span>
      <span class="weather-desc">${day.desc}</span>
    `;
    dayDiv.onclick = () => toggleHourlyDetail(index);
    forecastContainer.appendChild(dayDiv);
  });
}

function toggleHourlyDetail(dayIndex) {
  const hourlyContainer = document.getElementById("weather-hourly");
  if (!hourlyContainer) return;
  
  if (activeHourlyIndex === dayIndex) {
    hourlyContainer.style.display = "none";
    activeHourlyIndex = null;
    return;
  }
  
  activeHourlyIndex = dayIndex;
  const dayData = mockForecastData[dayIndex];
  
  let html = `<div style="font-weight:600; margin-bottom:2px; color:#30d158;">Hourly for ${dayData.name}:</div>`;
  dayData.hourly.forEach(h => {
    html += `<div class="hourly-row"><span>${h.time}</span><span>${formatTempDual(h.temp)}</span></div>`;
  });
  
  hourlyContainer.innerHTML = html;
  hourlyContainer.style.display = "block";
}

initWeather();

// ===== GOOGLE CALENDAR AUTH & EVENTS =====
let tokenClient;
let gapiInited = false;
let gsisInited = false;

function gapiLoaded() {
  if (typeof gapi !== 'undefined') {
    gapi.load('client', initializeGapiClient);
  }
}

async function initializeGapiClient() {
  try {
    await gapi.client.init({
      apiKey: API_KEY,
      discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
    });
    gapiInited = true;
    maybeEnableSignIn();
  } catch (err) {
    console.error("GAPI init error:", err);
  }
}

function gisLoaded() {
  if (typeof google !== 'undefined' && google.accounts) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: async (resp) => {
        try {
          if (resp.error !== undefined) {
            console.error("Auth error:", resp);
            const statusEl = document.getElementById('auth-status');
            if (statusEl) statusEl.textContent = 'Sign-in failed';
            return;
          }
          const statusEl = document.getElementById('auth-status');
          const signBtn = document.getElementById('sign-in');
          if (statusEl) statusEl.textContent = 'Connected';
          if (signBtn) signBtn.textContent = 'Refresh';
          await listUpcomingEvents();
          setInterval(listUpcomingEvents, 15 * 60 * 1000);
        } catch (callbackErr) {
          console.error("Error in auth callback:", callbackErr);
        }
      },
    });
    gsisInited = true;
    maybeEnableSignIn();
  }
}

function maybeEnableSignIn() {
  const signInBtn = document.getElementById('sign-in');
  const authStatus = document.getElementById('auth-status');
  if (gapiInited && gsisInited && signInBtn) {
    signInBtn.removeAttribute('disabled');
    if (authStatus) authStatus.textContent = 'Signed out';
  }
}

const signInBtn = document.getElementById('sign-in');
if (signInBtn) {
  signInBtn.onclick = () => {
    try {
      if (!tokenClient) {
        const statusEl = document.getElementById('auth-status');
        if (statusEl) statusEl.textContent = 'Auth loading...';
        return;
      }
      if (!gapi.client.getToken()) {
        tokenClient.requestAccessToken({prompt: 'consent'});
      } else {
        tokenClient.requestAccessToken({prompt: ''});
      }
    } catch (err) {
      console.error("Token request error:", err);
      const statusEl = document.getElementById('auth-status');
      if (statusEl) statusEl.textContent = 'Auth error';
    }
  };
}

// Voice Alerts Setup
const voiceBtn = document.getElementById('enable-voice');
if (voiceBtn) {
  voiceBtn.onclick = () => {
    voiceEnabled = !voiceEnabled;
    if (voiceEnabled) {
      voiceBtn.style.background = '#30d158';
      voiceBtn.style.color = '#000';
      speak("Voice alerts enabled.");
    } else {
      voiceBtn.style.background = 'rgba(255, 255, 255, 0.1)';
      voiceBtn.style.color = '#fff';
      speak("Voice alerts disabled.");
    }
  };
}

function speak(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utterance);
  }
}

setInterval(() => {
  if (!voiceEnabled || cachedEvents.length === 0) return;
  const now = new Date();
  
  cachedEvents.forEach(event => {
    if (!event.start) return;
    const startStr = event.start.dateTime || event.start.date;
    const startTime = new Date(startStr);
    const diffMinutes = (startTime - now) / (1000 * 60);
    
    if (diffMinutes >= 29 && diffMinutes <= 31 && !spokenEvents.has(event.id)) {
      speak(`Reminder: ${event.summary} starts in 30 minutes.`);
      spokenEvents.add(event.id);
    }
  });
}, 30000);

async function listUpcomingEvents() {
  try {
    const now = new Date();
    const response = await gapi.client.calendar.events.list({
      'calendarId': CALENDAR_ID,
      'timeMin': now.toISOString(),
      'showDeleted': false,
      'singleEvents': true,
      'maxResults': 250,
      'orderBy': 'startTime',
    });
    
    cachedEvents = response.result.items || [];
    const eventsEl = document.getElementById('events');
    if (!eventsEl) return;
    eventsEl.innerHTML = '';
    
    if (cachedEvents.length === 0) {
      eventsEl.innerHTML = '<div style="padding:4px; font-size:8px; opacity:0.7;">No upcoming events found.</div>';
      return;
    }
    
    cachedEvents.forEach(event => {
      const start = event.start.dateTime || event.start.date;
      const startDate = new Date(start);
      const timeStr = startDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dayStr = startDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      const location = event.location ? event.location : 'No location specified';
      
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `
        <div class="event-header-row">
          <div class="event-time-container">
            <span class="event-time">${dayStr}</span>
            <span class="event-end-time">${timeStr}</span>
          </div>
          <div class="event-title">${event.summary || 'Untitled Event'}</div>
        </div>
        <div class="event-location">📍 ${location}</div>
      `;
      eventsEl.appendChild(div);
    });
  } catch (err) {
    console.error("Error loading calendar events", err);
    const eventsEl = document.getElementById('events');
    if (eventsEl) {
      eventsEl.innerHTML = '<div style="padding:4px; font-size:8px; color:#ff5f56;">Error loading calendar items. Check API/Calendar ID.</div>';
    }
    const statusEl = document.getElementById('auth-status');
    if (statusEl) statusEl.textContent = 'Error loading calendar';
  }
}
