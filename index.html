<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>macOS Wall Dashboard - Portrait (Fire HD 8)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<!-- Google APIs -->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<!-- TradingView Widget Script -->
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async></script>
<style>
/* ===== MACOS PORTRAIT UI SYSTEM FOR FIRE HD 8 (800x1280) ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #f5f5f7;
  background-color: #1e1e1e;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image: url("background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Portrait Layout Grid: 2 Equal Columns or Stacked Split */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: brightness(0.85);
  display: grid;
  grid-template-columns: 1fr 1fr; /* Two vertical columns for portrait tablet */
  gap: 12px;
  padding: 12px;
  box-sizing: border-box;
}

/* macOS Frosted Glass Window Panel */
.macos-panel {
  background: rgba(30, 30, 30, 0.65);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  padding: 14px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
}

/* macOS Window Header dots */
.macos-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.window-dots {
  display: flex;
  gap: 5px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }

.panel-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}

/* ===== LEFT COLUMN: Clock, Weather, Markets ===== */
.column-left {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  min-width: 0;
}

/* Clock Panel */
.clock-panel {
  flex: 0 0 auto;
  align-items: center;
  text-align: center;
  padding: 12px;
}

#clock {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
  color: #ffffff;
}

#date {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 2px;
  font-weight: 500;
  text-transform: uppercase;
}

/* Weather Panel */
.weather-panel {
  flex: 1.2;
  min-height: 0;
  overflow-y: auto;
}

#weather-current {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#weather-forecast {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.weather-day {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 8px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 6px;
  font-size: 11px;
}

.weather-name {
  font-weight: 600;
  width: 60px;
}

.weather-temp {
  font-weight: 700;
  color: #30d158;
  white-space: nowrap;
}

.weather-desc {
  color: rgba(255, 255, 255, 0.7);
  text-align: right;
  font-size: 10px;
  flex: 1;
  padding-left: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Markets / Stock Panel */
.stock-panel {
  flex: 1;
  min-height: 0;
  padding: 10px;
}

#tradingview-widget-container {
  width: 100%;
  height: 100%;
}


/* ===== RIGHT COLUMN: Quotes & Calendars (More space requested) ===== */
.column-right {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  min-width: 0;
}

/* Expanded Thought for the Day Panel */
.thought-panel {
  flex: 1.3;
  min-height: 0;
  overflow-y: auto;
}

#thought-container {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 12px;
  box-sizing: border-box;
  text-align: left;
  margin-top: 4px;
}

.thought-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #30d158;
  margin-bottom: 6px;
}

#thought-text {
  font-size: 13px;
  line-height: 1.5;
  color: #f0f0f0;
  font-style: italic;
}

/* Calendar & Reminders Panel */
.events-panel {
  flex: 1.7;
  min-height: 0;
}

.auth-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

#auth-status {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.7);
}

.macos-btn {
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  cursor: pointer;
  transition: all 0.2s;
}

.macos-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

#events-container {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding-right: 2px;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 4px;
}

.event-day {
  margin-top: 8px;
  margin-bottom: 4px;
  font-weight: 700;
  font-size: 11px;
  color: #30d158;
  letter-spacing: 0.3px;
}

.event-item {
  margin-bottom: 5px;
  padding: 7px 9px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 6px;
}

.event-time-container {
  display: flex;
  flex-direction: column;
  min-width: 65px;
}

.event-time {
  font-weight: 600;
  font-size: 10px;
  color: #fff;
}

.event-end-time {
  font-size: 9px;
  color: rgba(255, 255, 255, 0.5);
}

.event-title {
  flex: 1;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
}

.event-location {
  display: block;
  font-size: 9px;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 2px;
}
</style>
</head>
<body>
<div class="overlay">
  <!-- COLUMN LEFT: Clock, Weather, Markets -->
  <div class="column-left">
    <!-- Clock Panel -->
    <div class="macos-panel clock-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Clock</div>
        <div style="width: 30px;"></div>
      </div>
      <div id="clock">--:-- --</div>
      <div id="date">Loading date…</div>
    </div>

    <!-- Weather Panel -->
    <div class="macos-panel weather-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Weather (°C / °F)</div>
        <div style="width: 30px;"></div>
      </div>
      <div id="weather-current">Loading weather…</div>
      <div id="weather-forecast"></div>
    </div>

    <!-- Markets / Stock Panel -->
    <div class="macos-panel stock-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Markets</div>
        <div style="width: 30px;"></div>
      </div>
      <div id="tradingview-widget-container">
        <!-- TradingView Mini Symbol Overview Widget -->
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
      </div>
    </div>
  </div>
  
  <!-- COLUMN RIGHT: Quotes & Calendar/Reminders -->
  <div class="column-right">
    <!-- Expanded Thought for the Day Panel -->
    <div class="macos-panel thought-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Thought for the Day</div>
        <div style="width: 30px;"></div>
      </div>
      <div id="thought-container">
        <div class="thought-label" id="thought-title">Napoleon Hill</div>
        <div id="thought-text">Fetching today's wisdom...</div>
      </div>
    </div>

    <!-- Calendar Events & Reminders Panel -->
    <div class="macos-panel events-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Calendar & Reminders</div>
        <div style="width: 30px;"></div>
      </div>
      <div class="auth-bar">
        <span id="auth-status">Ready to connect</span>
        <div>
          <button id="sign-in" class="macos-btn">Sign In</button>
          <button id="enable-voice" class="macos-btn">Voice</button>
        </div>
      </div>
      <div id="events-container">
        <div id="events">
          <div style="padding: 10px; opacity: 0.7; font-size: 11px;">Click 'Sign In' above to load your Google Calendar events.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== CONFIGURATION =====
const CLIENT_ID = "703875968822-6ma5u7st5qm3eqgb1ktt9p52vs8knrb3.apps.googleusercontent.com";
const API_KEY = "AIzaSyCcx8q0nHP9DkA-M_KFyjFo-uLV-7TOrSE";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
const CALENDAR_ID = "family03331431524389313579@group.calendar.google.com";

// Published Google Sheet CSV URL for Thoughts
const QUOTES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREcumm4p5A9G-506IZdhpDsBHZtbeHLiVMVbZJHLGFs6kkl3QPamiaOGmx1U8MADueTO-45bipj-wv/pub?output=csv";

// CSV Parser
function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  return lines.map(line => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  });
}

function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

// Fetch today's thought from published Google Sheet CSV
async function fetchAndDisplayTodayThought() {
  const now = new Date();
  const monthName = now.toLocaleString('en-US', { month: 'long' });
  const dayNum = now.getDate();
  const todayFormatted = `${monthName} ${dayNum}`;
  
  try {
    const response = await fetch(QUOTES_CSV_URL);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    
    if (rows.length < 2) throw new Error("CSV has no data rows");
    
    const dataRows = rows.slice(1).filter(r => r.length >= 2 && r[0]);
    let matchedRow = dataRows.find(r => r[0].toLowerCase() === todayFormatted.toLowerCase());
    
    if (!matchedRow) {
      const dayOfYear = getDayOfYear(now);
      const index = (dayOfYear - 1) % dataRows.length;
      matchedRow = dataRows[index];
    }
    
    if (matchedRow) {
      const dateCol = matchedRow[0];
      const principleCol = matchedRow[1] || '';
      const quoteCol = matchedRow[2] || matchedRow[1] || '';
      
      const titleElem = document.getElementById("thought-title");
      const textElem = document.getElementById("thought-text");
      
      if (principleCol && principleCol !== quoteCol) {
        titleElem.textContent = `${dateCol}: ${principleCol}`;
      } else {
        titleElem.textContent = `Napoleon Hill — ${dateCol}`;
      }
      
      textElem.textContent = `"${quoteCol}"`;
    }
  } catch (error) {
    console.error("Error fetching quotes CSV:", error);
    document.getElementById("thought-text").textContent = `"Whatever the mind can conceive and believe, it can achieve." — Napoleon Hill`;
  }
}

// ===== CLOCK & DATE =====
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  });
  document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}

setInterval(updateClock, 1000);
updateClock();
fetchAndDisplayTodayThought();

// ===== DUAL TEMPERATURE FORMATTER (°C & °F) =====
function formatTempDual(tempC) {
  if (tempC === undefined || tempC === null || isNaN(tempC)) return "--°C / --°F";
  const c = Math.round(tempC);
  const f = Math.round((tempC * 9/5) + 32);
  return `${c}°C / ${f}°F`;
}

// ===== MOCK WEATHER INIT (Ensures no infinite loading) =====
function initWeather() {
  // Fallback demo weather render so it never hangs on "Loading..."
  document.getElementById("weather-current").innerHTML = `<span>Today</span> <span>${formatTempDual(21)} ☀️</span>`;
  const forecastEl = document.getElementById("weather-forecast");
  forecastEl.innerHTML = `
    <div class="weather-day"><span class="weather-name">Tomorrow</span><span class="weather-temp">${formatTempDual(23)}</span><span class="weather-desc">Sunny & Clear</span></div>
    <div class="weather-day"><span class="weather-name">Wednesday</span><span class="weather-temp">${formatTempDual(19)}</span><span class="weather-desc">Partly Cloudy</span></div>
    <div class="weather-day"><span class="weather-name">Thursday</span><span class="weather-temp">${formatTempDual(18)}</span><span class="weather-desc">Light Showers</span></div>
  `;
}
initWeather();

// ===== TRADINGVIEW MARKETS WIDGET INIT =====
function initTradingView() {
  const container = document.getElementById("tradingview-widget-container");
  if (container) {
    container.innerHTML = `
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {
        "symbol": "SP:SPX",
        "width": "100%",
        "height": "100%",
        "locale": "en",
        "dateRange": "1D",
        "colorTheme": "dark",
        "trendLineColor": "#30d158",
        "underLineColor": "rgba(48, 209, 88, 0.2)",
        "underLineColorBottom": "rgba(48, 209, 88, 0.0)",
        "isTransparent": true,
        "autosize": true,
        "largeChartUrl": ""
      }
      <\/script>
    `;
  }
}
initTradingView();
</script>
