<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>macOS Wall Dashboard - Fire HD 8</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<!-- Google APIs -->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
/* ===== MACOS UI SYSTEM FOR FIRE HD 8 ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #f5f5f7;
  background-color: #1e1e1e;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image: url("background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* macOS Desktop Grid */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: brightness(0.9);
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 14px;
  padding: 14px;
  box-sizing: border-box;
}

/* macOS Frosted Glass Window Panel */
.macos-panel {
  background: rgba(30, 30, 30, 0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  padding: 16px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
}

/* macOS Window Header dots */
.macos-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.window-dots {
  display: flex;
  gap: 6px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }

.panel-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}

/* ===== LEFT COLUMN ===== */
.left-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  height: 100%;
  min-width: 0;
}

/* Clock & Thought Panel */
.clock-thought-panel {
  flex: 0 0 auto;
  align-items: center;
  text-align: center;
}

#clock {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
  color: #ffffff;
}

#date {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 2px;
  margin-bottom: 12px;
  font-weight: 500;
}

#thought-container {
  width: 100%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 10px 14px;
  box-sizing: border-box;
  text-align: left;
}

.thought-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #30d158; /* macOS Green */
  margin-bottom: 4px;
}

#thought-text {
  font-size: 12px;
  line-height: 1.4;
  color: #e5e5ea;
  font-style: italic;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Events Panel */
.events-panel {
  flex: 1;
  min-height: 0;
}

.auth-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

#auth-status {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
}

.macos-btn {
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  cursor: pointer;
  transition: all 0.2s;
}

.macos-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

#events-container {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding-right: 2px;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 4px;
}

.event-day {
  margin-top: 10px;
  margin-bottom: 4px;
  font-weight: 700;
  font-size: 12px;
  color: #30d158;
  letter-spacing: 0.3px;
}

.event-item {
  margin-bottom: 6px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.event-time-container {
  display: flex;
  flex-direction: column;
  min-width: 70px;
}

.event-time {
  font-weight: 600;
  font-size: 11px;
  color: #fff;
}

.event-end-time {
  font-size: 9px;
  color: rgba(255, 255, 255, 0.5);
}

.event-title {
  flex: 1;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
}

.event-location {
  display: block;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 2px;
}

/* ===== RIGHT COLUMN ===== */
.right-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  height: 100%;
  min-width: 0;
}

#weather-panel {
  flex: 1.2;
  min-height: 0;
  overflow-y: auto;
}

#weather-current {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#weather-forecast {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.weather-day {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 8px;
  font-size: 11px;
}

.weather-name {
  font-weight: 600;
  width: 65px;
}

.weather-temp {
  font-weight: 700;
  color: #30d158;
  white-space: nowrap;
}

.weather-desc {
  color: rgba(255, 255, 255, 0.7);
  text-align: right;
  font-size: 11px;
  flex: 1;
  padding-left: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#stock-panel {
  flex: 1;
  min-height: 0;
  padding: 0;
  overflow: hidden;
}

#tradingview-widget {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div class="overlay">
  <!-- LEFT COLUMN -->
  <div class="left-panel">
    <!-- Clock & Thought Panel -->
    <div class="macos-panel clock-thought-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">System Clock & Thought</div>
        <div style="width: 34px;"></div>
      </div>
      <div id="clock">--:-- --</div>
      <div id="date">Loading date…</div>
      <div id="thought-container">
        <div class="thought-label" id="thought-title">Napoleon Hill's Thought for the Day</div>
        <div id="thought-text">Fetching today's wisdom from cloud...</div>
      </div>
    </div>
    
    <!-- Calendar Events Panel -->
    <div class="macos-panel events-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Calendar & Reminders</div>
        <div style="width: 34px;"></div>
      </div>
      <div class="auth-bar">
        <span id="auth-status">Initializing...</span>
        <div>
          <button id="sign-in" class="macos-btn" disabled>Sign In</button>
          <button id="enable-voice" class="macos-btn">Voice</button>
        </div>
      </div>
      <div id="events-container">
        <div id="events"></div>
      </div>
    </div>
  </div>
  
  <!-- RIGHT COLUMN -->
  <div class="right-panel">
    <!-- Weather Panel -->
    <div class="macos-panel" id="weather-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Weather & Forecast (°C / °F)</div>
        <div style="width: 34px;"></div>
      </div>
      <div id="weather-current">Loading weather…</div>
      <div id="weather-forecast"></div>
    </div>

    <!-- Stock Panel -->
    <div class="macos-panel" id="stock-panel">
      <div class="macos-header" style="padding: 10px 14px 6px 14px; margin-bottom: 4px;">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Markets</div>
        <div style="width: 34px;"></div>
      </div>
      <div id="tradingview-widget" style="flex:1;"></div>
    </div>
  </div>
</div>

<script>
// ===== CONFIGURATION =====
const CLIENT_ID = "703875968822-6ma5u7st5qm3eqgb1ktt9p52vs8knrb3.apps.googleusercontent.com";
const API_KEY = "AIzaSyCcx8q0nHP9DkA-M_KFyjFo-uLV-7TOrSE";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
const CALENDAR_ID = "family03331431524389313579@group.calendar.google.com";

// Published Google Sheet CSV URL for Thoughts
const QUOTES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREcumm4p5A9G-506IZdhpDsBHZtbeHLiVMVbZJHLGFs6kkl3QPamiaOGmx1U8MADueTO-45bipj-wv/pub?output=csv";

// CSV Parser
function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  return lines.map(line => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  });
}

function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

// Fetch today's thought from published Google Sheet CSV
async function fetchAndDisplayTodayThought() {
  const now = new Date();
  const monthName = now.toLocaleString('en-US', { month: 'long' });
  const dayNum = now.getDate();
  const todayFormatted = `${monthName} ${dayNum}`;
  
  try {
    const response = await fetch(QUOTES_CSV_URL);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    
    if (rows.length < 2) throw new Error("CSV has no data rows");
    
    const dataRows = rows.slice(1).filter(r => r.length >= 2 && r[0]);
    let matchedRow = dataRows.find(r => r[0].toLowerCase() === todayFormatted.toLowerCase());
    
    if (!matchedRow) {
      const dayOfYear = getDayOfYear(now);
      const index = (dayOfYear - 1) % dataRows.length;
      matchedRow = dataRows[index];
    }
    
    if (matchedRow) {
      const dateCol = matchedRow[0];
      const principleCol = matchedRow[1] || '';
      const quoteCol = matchedRow[2] || matchedRow[1] || '';
      
      const titleElem = document.getElementById("thought-title");
      const textElem = document.getElementById("thought-text");
      
      if (principleCol && principleCol !== quoteCol) {
        titleElem.textContent = `${dateCol}: ${principleCol}`;
      } else {
        titleElem.textContent = `Napoleon Hill — ${dateCol}`;
      }
      
      textElem.textContent = `"${quoteCol}"`;
    }
  } catch (error) {
    console.error("Error fetching quotes CSV:", error);
    document.getElementById("thought-text").textContent = `"Whatever the mind can conceive and believe, it can achieve." — Napoleon Hill`;
  }
}

// ===== CLOCK & DATE =====
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  });
  document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}

setInterval(updateClock, 1000);
updateClock();
fetchAndDisplayTodayThought();
setInterval(fetchAndDisplayTodayThought, 60 * 60 * 1000);

// ===== DUAL TEMPERATURE FORMATTER (°C & °F) =====
function formatTempDual(tempC) {
  if (tempC === undefined || tempC === null || isNaN(tempC)) return "--°C / --°F";
  const c = Math.round(tempC);
  const f = Math.round((tempC * 9/5) + 32);
  return `${c}°C / ${f}°F`;
}
</script>
