<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wall Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Google APIs -->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: Arial, sans-serif;
  color: #ffffff;
  overflow: hidden;
}
body {
  background-image: url("background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
/* TWO COLUMNS: left (clock+thought & events), right (weather & stock) */
.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(0,0,0,0.35), rgba(0,0,0,0.85));
  display: flex;
  flex-direction: row;
  padding: 16px;
  box-sizing: border-box;
  gap: 16px;
}

/* ===== LEFT COLUMN ===== */
.left-panel {
  flex: 7; /* 70% of screen width */
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
}

/* Row 1: Clock + Thought for the Day */
.row-1 {
  flex: 0 0 auto;
  display: flex;
  gap: 12px;
  height: 38%;
  min-height: 240px;
}

/* Clock Panel */
.clock-panel {
  flex: 1; 
  background: rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-width: 0;
  text-align: center;
  overflow-y: auto;
}

/* Row 2: Events */
.events-panel {
  flex: 1; 
  background: rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 320px;
}

/* ===== CLOCK & THOUGHT STYLING ===== */
#clock {
  font-size: 36px;
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 2px;
}
#date {
  font-size: 16px;
  opacity: 0.85;
  line-height: 1.1;
  margin-bottom: 10px;
}

#thought-container {
  background: rgba(255, 255, 255, 0.08);
  border-left: 4px solid #4CAF50;
  padding: 10px 14px;
  border-radius: 4px;
  max-width: 100%;
  width: 100%;
  box-sizing: border-box;
  text-align: left;
}

.thought-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #4CAF50;
  margin-bottom: 4px;
}

#thought-text {
  font-size: 13px;
  line-height: 1.4;
  color: #f0f0f0;
  font-style: italic;
}

/* ===== EVENTS PANEL STYLING ===== */
#auth-status {
  font-size: 14px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

#events-container {
  flex: 1;
  overflow-y: auto;
  max-height: 100%;
}

#events {
  flex: 1;
  overflow-y: auto;
  font-size: 14px;
}

.event-day {
  margin-top: 12px;
  margin-bottom: 6px;
  font-weight: 600;
  font-size: 15px;
  opacity: 0.9;
  color: #4CAF50;
}

.event-item {
  margin-bottom: 8px;
  padding: 8px 10px;
  background: rgba(0, 255, 0, 0.05);
  border-radius: 6px;
  color: #f7f5f5;
  font-size: 14px;
  font-weight: bold;
  display: flex;
  border-left: 3px solid #4CAF50;
}

.event-time-container {
  display: flex;
  flex-direction: column;
  min-width: 25%;
  margin-right: 12px;
}

.event-time {
  font-weight: 600;
  white-space: nowrap;
  font-size: 14px;
}

.event-end-time {
  font-size: 11px;
  color: #e3dede;
  margin-top: 2px;
  white-space: nowrap;
}

.event-title {
  flex: 1;
  min-width: 60%;
  line-height: 1.3;
  font-size: 14px;
}

.event-location {
  display: block;
  font-size: 12px;
  color: #e3dede;
  margin-top: 4px;
  width: 100%;
}

/* Auth buttons */
#sign-in, #enable-voice {
  padding: 8px 16px;
  margin-top: 6px;
  margin-right: 10px;
  font-size: 14px;
  border-radius: 4px;
  border: 1px solid #ffffff;
  background: rgba(255,255,255,0.1);
  color: #ffffff;
  cursor: pointer;
  display: inline-block;
}

#sign-in:hover, #enable-voice:hover {
  background: rgba(255,255,255,0.25);
}

/* ===== RIGHT COLUMN ===== */
.right-panel {
  flex: 3 !important;
  min-width: 300px !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 16px !important;
  min-height: 0 !important;
}

#weather-panel {
  flex: 5 1 0;
  min-height: 180px;
  overflow-y: auto;
}

#stock-panel {
  flex: 5 1 0;
  min-height: 140px;
}

.panel {
  background: rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  padding: 16px;
  box-sizing: border-box;
}

/* ===== WEATHER STYLING ===== */
#weather-current {
  font-size: 20px;
  font-weight: 600;
}

#weather-forecast {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
}

.weather-day {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 8px;
  background: rgba(255,255,255,0.07);
  border-radius: 4px;
}

.weather-icon {
  width: 38px;
  height: 38px;
  margin-right: 8px;
}

.weather-name {
  width: 80px;
  font-weight: 600;
  font-size: 13px;
}

.weather-temp {
  font-weight: 600;
  margin-right: 10px;
  margin-left: 10px;
  font-size: 13px;
  white-space: nowrap;
}

.weather-desc {
  opacity: 0.9;
  flex: 1;
  text-align: right;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="overlay">
  <!-- LEFT column: row 1 (clock + thought) + row 2 (events) -->
  <div class="left-panel">
    <!-- Row 1: Clock & Thought for the Day -->
    <div class="row-1">
      <div class="panel clock-panel">
        <div id="clock">--:-- --</div>
        <div id="date">Loading date…</div>
        <div id="thought-container">
          <div class="thought-title" id="thought-title">Napoleon Hill's Thought for the Day</div>
          <div id="thought-text">Loading today's quote from Google Sheets...</div>
        </div>
      </div>
    </div>
    
    <!-- Row 2: Events -->
    <div class="panel events-panel">
      <div id="auth-status">Initializing...</div>
      <button id="sign-in" disabled>Loading Google Sign-in...</button>
      <button id="enable-voice">Enable voice alerts</button>
      <div id="events-container">
        <div id="events"></div>
      </div>
    </div>
  </div>
  
  <!-- RIGHT column: weather + stock -->
  <div class="right-panel">
    <div class="panel" id="weather-panel">
      <div id="weather-current">Loading weather…</div>
      <div id="weather-forecast"></div>
    </div>

    <div class="panel" id="stock-panel">
      <div id="tradingview-widget" style="width:100%;height:100%;"></div>
    </div>
  </div>
</div>

<script>
// ===== CONFIGURATION =====
const CLIENT_ID = "703875968822-6ma5u7st5qm3eqgb1ktt9p52vs8knrb3.apps.googleusercontent.com";
const API_KEY = "AIzaSyCcx8q0nHP9DkA-M_KFyjFo-uLV-7TOrSE";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
const CALENDAR_ID = "family03331431524389313579@group.calendar.google.com";

// Published Google Sheet CSV URL
const QUOTES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREcumm4p5A9G-506IZdhpDsBHZtbeHLiVMVbZJHLGFs6kkl3QPamiaOGmx1U8MADueTO-45bipj-wv/pub?output=csv";

// Simple CSV parser handling quotes & commas
function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  return lines.map(line => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  });
}

// Helper to get day of year (1-366)
function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

// Fetch published CSV and display today's quote
async function fetchAndDisplayTodayThought() {
  const now = new Date();
  
  // Format current date matching "Month Day" (e.g., "October 19")
  const monthName = now.toLocaleString('en-US', { month: 'long' });
  const dayNum = now.getDate();
  const todayFormatted = `${monthName} ${dayNum}`;
  
  try {
    const response = await fetch(QUOTES_CSV_URL);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    
    if (rows.length < 2) throw new Error("CSV has no data rows");
    
    // Ignore header row (index 0)
    const dataRows = rows.slice(1).filter(r => r.length >= 2 && r[0]);
    
    // Try matching exact date string (e.g. "October 19")
    let matchedRow = dataRows.find(r => r[0].toLowerCase() === todayFormatted.toLowerCase());
    
    // Fallback if date string doesn't match: match by day-of-year index
    if (!matchedRow) {
      const dayOfYear = getDayOfYear(now);
      const index = (dayOfYear - 1) % dataRows.length;
      matchedRow = dataRows[index];
    }
    
    if (matchedRow) {
      const dateCol = matchedRow[0];
      const principleCol = matchedRow[1] || '';
      const quoteCol = matchedRow[2] || matchedRow[1] || '';
      
      const titleElem = document.getElementById("thought-title");
      const textElem = document.getElementById("thought-text");
      
      if (principleCol && principleCol !== quoteCol) {
        titleElem.textContent = `Thought for ${dateCol}: ${principleCol}`;
      } else {
        titleElem.textContent = `Napoleon Hill's Thought for ${dateCol}`;
      }
      
      textElem.textContent = `"${quoteCol}"`;
    }
  } catch (error) {
    console.error("Error fetching quotes CSV:", error);
    document.getElementById("thought-text").textContent = `"Whatever the mind can conceive and believe, it can achieve." — Napoleon Hill`;
  }
}

// ===== CLOCK & DATE =====
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  });
  document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
  });
}

setInterval(updateClock, 1000);
updateClock();
fetchAndDisplayTodayThought();

// Refresh quote once every hour
setInterval(fetchAndDisplayTodayThought, 60 * 60 * 1000);

// ===== TEMPERATURE DUAL FORMATTER (Celsius & Fahrenheit) =====
function formatTempDual(tempC) {
  if (tempC === undefined || tempC === null || isNaN(tempC)) return "--°C / --°F";
  const c = Math.round(tempC);
  const f = Math.round((tempC * 9/5) + 32);
  return `${c}°C / ${f}°F`;
}
</script>
</body>
