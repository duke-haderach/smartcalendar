<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wall Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Google APIs -->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: Arial, sans-serif;
  color: #ffffff;
  overflow: hidden;
}
body {
  background-image: url("background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #1e1e1e; /* Fallback if background.jpg is missing */
}
/* TWO COLUMNS: left (clock+events), right (weather+stock) */
.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(0,0,0,0.35), rgba(0,0,0,0.85));
  display: flex;
  flex-direction: row;
  padding: 16px;
  box-sizing: border-box;
  gap: 16px;
}

/* ===== LEFT COLUMN - TWO ROW LAYOUT ===== */
.left-panel {
  flex: 7; /* 70% of screen width */
  display: flex;
  flex-direction: column;
  gap: 12px; /* Gap between the two rows */
  height: 100%;
}

/* Row 1: Clock + Transactions */
.row-1 {
  flex: 0 0 auto; /* Don't grow, don't shrink */
  display: flex;
  gap: 12px;
  height: 30%; /* Approximately 30% of left panel */
  min-height: 200px;
}

/* Clock Panel */
.clock-panel {
  flex: 0.5; /* Take half of row 1 */
  background: rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}

/* Transactions Panel */
.transactions-panel {
  flex: 1.5; /* Take half of row 1 */
  background: rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Row 2: Events */
.events-panel {
  flex: 1; /* Take remaining 70% of left panel */
  background: rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 400px;
}

/* ===== CLOCK STYLING ===== */
#clock {
  font-size: 36px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
  text-align: center;
}
#date {
  font-size: 18px;
  opacity: 0.8;
  line-height: 1.2;
  text-align: center;
}

/* ===== TRANSACTIONS PANEL STYLING ===== */
.transactions-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.transactions-title-container {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.transactions-title-container > div:first-child {
  font-size: 10px;
  font-weight: 600;
  margin-bottom: 2px;
}

#last-updated {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 4px;
  font-style: italic;
}

/* Compact table styling */
.cards-table-container {
  flex: 1;
  overflow-y: auto;
  max-height: calc(100% - 50px);
}

.cards-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.cards-table th {
  text-align: left;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.1);
  border-bottom: 2px solid rgba(255, 255, 255, 0.2);
  font-size: 11px !important;
  position: sticky;
  top: 0;
  z-index: 10;
  opacity: 0.8;
}

.cards-table td {
  padding: 6px 10px !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  font-size: 12px !important;
}

.cards-table tr:hover {
  background: rgba(255, 255, 255, 0.03);
}

.cards-table .amount {
  text-align: right;
  font-family: 'Courier New', monospace !important;
  font-size: 13px;
  font-weight: 600 !important;
}

/* Sync button styling */
#sync-sheets-btn {
  padding: 8px 14px;
  background: rgba(66, 133, 244, 0.3);
  color: #4285F4;
  border: 1px solid rgba(66, 133, 244, 0.7);
  border-radius: 4px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}

#sync-sheets-btn:hover {
  background: rgba(66, 133, 244, 0.4);
  box-shadow: 0 2px 4px rgba(66, 133, 244, 0.3);
}

#total-balance {
  background: rgba(0, 0, 0, 0.3);
  padding: 6px 12px;
  border-radius: 6px;
  border-left: 3px solid currentColor;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
#total-balance:hover {
  transform: translateY(-1px);
  transition: transform 0.2s;
}

/* ===== EVENTS PANEL STYLING ===== */
#auth-status {
  font-size: 14px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

#events-container {
  flex: 1;
  overflow-y: auto;
  max-height: 100%;
}

#events {
  flex: 1;
  overflow-y: auto;
  font-size: 14px;
}

.event-day {
  margin-top: 12px;
  margin-bottom: 6px;
  font-weight: 600;
  font-size: 15px;
  opacity: 0.9;
  color: #4CAF50;
}

.event-item {
  margin-bottom: 8px;
  padding: 8px 10px;
  background: rgba(0, 255, 0, 0.05);
  border-radius: 6px;
  color: #f7f5f5;
  font-size: 14px;
  font-weight: bold;
  display: flex;
  border-left: 3px solid #4CAF50;
}

.event-time-container {
  display: flex;
  flex-direction: column;
  min-width: 25%;
  margin-right: 12px;
}

.event-time {
  font-weight: 600;
  white-space: nowrap;
  font-size: 14px;
}

.event-end-time {
  font-size: 11px;
  color: #e3dede;
  margin-top: 2px;
  white-space: nowrap;
}

.event-title {
  flex: 1;
  min-width: 60%;
  line-height: 1.3;
  font-size: 14px;
}

.event-location {
  display: block;
  font-size: 12px;
  color: #e3dede;
  margin-top: 4px;
  width: 100%;
}

/* Auth buttons */
#sign-in, #enable-voice {
  padding: 8px 16px;
  margin-top: 6px;
  margin-right: 10px;
  font-size: 14px;
  border-radius: 4px;
  border: 1px solid #ffffff;
  background: rgba(255,255,255,0.1);
  color: #ffffff;
  cursor: pointer;
  display: inline-block;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

#sign-in:hover, #enable-voice:hover {
  background: rgba(255,255,255,0.25);
}

/* ===== RIGHT COLUMN ===== */
.right-panel {
  flex: 3 !important;
  min-width: 300px !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 16px !important;
  min-height: 0 !important;
}

#weather-panel {
  flex: 4 1 0;
  min-height: 180px;
  max-height: 1060px;
  overflow-y: auto;
}

#youtube-panel {
  flex: 3 1 0 !important;
  min-height: 200px !important;
  max-height: 500px !important;
  overflow: hidden !important;
  position: relative !important;
}

#stock-panel {
  flex: 3 1 0;
  min-height: 140px;
}

#weather-panel, #stock-panel {
  flex-shrink: 0 !important;
}

.panel {
  background: rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  padding: 16px;
  box-sizing: border-box;
}

/* ===== WEATHER STYLING ===== */
#weather-current {
  font-size: 22px;
  font-weight: 600;
}

#weather-forecast {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
}

.weather-day {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 8px;
  background: rgba(255,255,255,0.07);
  border-radius: 4px;
  cursor: pointer;
}

.weather-name {
  width: 80px;
  font-weight: 600;
  font-size: 13px;
}

.weather-temp {
  font-weight: 600;
  margin-right: 10px;
  margin-left: 15px;
  font-size: 13px;
}

.weather-desc {
  opacity: 0.9;
  flex: 1;
  text-align: right;
  margin-left: 15px;
  font-size: 12px;
}

/* ===== YOUTUBE STYLING ===== */
#youtube-widget-container {
  width: 100% !important;
  height: 100% !important;
  display: flex !important;
  flex-direction: column !important;
  overflow: hidden !important;
}

#youtube-search-section {
  display: flex;
  gap: 0;
  margin-bottom: 12px;
  width: 100%;
}

#youtube-search-input {
  flex: 1;
  padding: 10px 12px;
  border-radius: 4px 0 0 4px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 14px;
  border-right: none;
  min-width: 150px;
}

#youtube-search-btn {
  padding: 0 15px;
  background: #ff0000;
  color: white;
  border: 1px solid #ff0000;
  border-radius: 0 4px 4px 0;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  display: flex !important;
  align-items: center;
  justify-content: center;
  min-width: 44px;
}

#youtube-search-btn:hover {
  background: #cc0000;
}

#youtube-player-area {
  flex-shrink: 0 !important;
  height: 180px !important;
  width: 100% !important;
  position: relative !important;
  margin-bottom: 10px !important;
}

#youtube-player {
  width: 100% !important;
  height: 100% !important;
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  background: #000 !important;
  border-radius: 4px !important;
  overflow: hidden !important;
}

#youtube-player iframe {
  width: 100% !important;
  height: 100% !important;
  display: block !important;
  border: none !important;
}

#youtube-video-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#youtube-video-channel {
  font-size: 12px;
  opacity: 0.8;
}
</style>
</head>
<body>
<div class="overlay">
  <!-- LEFT column: row 1 (clock + transactions) + row 2 (events) -->
  <div class="left-panel">
    <div class="row-1">
      <!-- Clock Panel -->
      <div class="panel clock-panel">
        <div id="clock">--:-- --</div>
        <div id="date">Loading date…</div>
      </div>
      
      <!-- Transactions Panel -->
      <div class="panel transactions-panel">
        <div class="transactions-header">
          <div class="transactions-title-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
              <div id="total-balance" style="font-weight: bold; font-size: 16px; color: #4CAF50;">Total: $0.00</div>
            </div>
            <div id="last-updated">Last updated: --</div>
          </div>
          <button id="sync-sheets-btn">🔄Sync</button>
        </div>
        <div class="cards-table-container">
          <table class="cards-table" id="cards-table">
            <thead>
              <tr>
                <th>Card Issuer</th>
                <th style="text-align: right;">Open Balance</th>
              </tr>
            </thead>
            <tbody>
              <!-- Dynamic Cards -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
    
    <!-- Row 2: Events -->
    <div class="panel events-panel">
      <div id="auth-status">Initializing Google Calendar...</div>
      <div>
        <button id="sign-in" disabled>Sign In</button>
        <button id="enable-voice">Enable voice alerts</button>
      </div>
      <div id="events-container">
        <div id="events"></div>
      </div>
    </div>
  </div>
  
  <!-- RIGHT column: weather + youtube + stock -->
  <div class="right-panel">
    <div class="panel" id="weather-panel">
      <div id="weather-current">Loading weather…</div>
      <div id="weather-forecast"></div>
    </div>

    <div class="panel" id="youtube-panel">
      <div id="youtube-widget-container">
        <div id="youtube-search-section">
          <input type="text" id="youtube-search-input" placeholder="Search Videos">
          <button id="youtube-search-btn" title="Search YouTube">🔍</button>
        </div>
        <div id="youtube-player-area">
          <div id="youtube-player"></div>
          <div id="youtube-video-info">
            <div id="youtube-video-title">Select a video to play</div>
            <div id="youtube-video-channel">Use search or quick buttons</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" id="stock-panel">
      <div id="tradingview-widget" style="width:100%;height:100%;"></div>
    </div>
  </div>
</div>

<script>
// ===== CONFIGURATION =====
const CLIENT_ID = "703875968822-6ma5u7st5qm3eqgb1ktt9p52vs8knrb3.apps.googleusercontent.com";
const API_KEY = "AIzaSyCcx8q0nHP9DkA-M_KFyjFo-uLV-7TOrSE";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
const CALENDAR_ID = "family03331431524389313579@group.calendar.google.com";

const DEFAULT_CARDS_SIMPLE = [
  { card_issuer: "Chase Sapphire", balance: 1250.45 },
  { card_issuer: "Amex Gold", balance: 450.00 },
  { card_issuer: "Discover It", balance: 89.20 }
];

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  const clockEl = document.getElementById("clock");
  const dateEl = document.getElementById("date");
  if (clockEl) {
    clockEl.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: true });
  }
  if (dateEl) {
    dateEl.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }
}
setInterval(updateClock, 1000);
updateClock();

// ===== CARDS TABLE DISPLAY =====
function displayCardsTable(cards) {
  const tbody = document.querySelector("#cards-table tbody");
  if (!tbody) return;
  tbody.innerHTML = "";
  let total = 0;

  cards.forEach(card => {
    const tr = document.createElement("tr");
    const bal = parseFloat(card.balance) || 0;
    total += bal;
    tr.innerHTML = `
      <td>${card.card_issuer || card.issuer || 'Card'}</td>
      <td class="amount">$${bal.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });

  const totalEl = document.getElementById("total-balance");
  if (totalEl) totalEl.textContent = `Total: $${total.toFixed(2)}`;
}

function updateLastUpdatedDisplay() {
  const updatedEl = document.getElementById("last-updated");
  if (updatedEl) {
    updatedEl.textContent = `Last updated: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  }
}

displayCardsTable(DEFAULT_CARDS_SIMPLE);
updateLastUpdatedDisplay();

// ===== WEATHER MOCK INITIALIZATION =====
function initWeather() {
  const currentEl = document.getElementById("weather-current");
  const forecastEl = document.getElementById("weather-forecast");
  if (currentEl) currentEl.textContent = "21°C • Sunny & Clear";
  if (forecastEl) {
    forecastEl.innerHTML = `
      <div class="weather-day"><span class="weather-name">Tomorrow</span><span class="weather-temp">23°C</span><span class="weather-desc">Mostly Sunny</span></div>
      <div class="weather-day"><span class="weather-name">Wednesday</span><span class="weather-temp">19°C</span><span class="weather-desc">Partly Cloudy</span></div>
      <div class="weather-day"><span class="weather-name">Thursday</span><span class="weather-temp">18°C</span><span class="weather-desc">Light Showers</span></div>
    `;
  }
}
initWeather();

// ===== GOOGLE CALENDAR GAPI & GIS SETUP =====
let tokenClient;
let gapiInited = false;
let gsisInited = false;
let cachedEvents = [];
let voiceEnabled = false;

function gapiLoaded() {
  if (typeof gapi !== 'undefined') {
    gapi.load('client', initializeGapiClient);
  }
}

async function initializeGapiClient() {
  try {
    await gapi.client.init({
      apiKey: API_KEY,
      discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
    });
    gapiInited = true;
    maybeEnableSignIn();
  } catch (err) {
    console.error("GAPI init error:", err);
  }
}

function gisLoaded() {
  if (typeof google !== 'undefined' && google.accounts) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (resp) => {
        if (resp.error !== undefined) {
          console.error("Auth error:", resp);
          document.getElementById('auth-status').textContent = 'Sign-in failed';
          return;
        }
        document.getElementById('auth-status').textContent = 'Connected to Google Calendar';
        document.getElementById('sign-in').textContent = 'Refresh Events';
        listUpcomingEvents();
        setInterval(listUpcomingEvents, 15 * 60 * 1000);
      },
    });
    gsisInited = true;
    maybeEnableSignIn();
  }
}

function maybeEnableSignIn() {
  const signInBtn = document.getElementById('sign-in');
  const authStatus = document.getElementById('auth-status');
  if (gapiInited && gsisInited && signInBtn) {
    signInBtn.removeAttribute('disabled');
    signInBtn.textContent = 'Sign In';
    if (authStatus) authStatus.textContent = 'Signed out. Click Sign In to load calendar.';
  }
}

const signInBtn = document.getElementById('sign-in');
if (signInBtn) {
  signInBtn.onclick = () => {
    if (!tokenClient) {
      document.getElementById('auth-status').textContent = 'Auth initializing...';
      return;
    }
    try {
      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({prompt: 'consent'});
      } else {
        tokenClient.requestAccessToken({prompt: ''});
      }
    } catch (err) {
      console.error("Token request error:", err);
    }
  };
}

const voiceBtn = document.getElementById('enable-voice');
if (voiceBtn) {
  voiceBtn.onclick = () => {
    voiceEnabled = !voiceEnabled;
    voiceBtn.style.background = voiceEnabled ? '#4CAF50' : 'rgba(255,255,255,0.1)';
    voiceBtn.textContent = voiceEnabled ? 'Voice alerts active' : 'Enable voice alerts';
  };
}

async function listUpcomingEvents() {
  try {
    const now = new Date();
    const response = await gapi.client.calendar.events.list({
      'calendarId': CALENDAR_ID,
      'timeMin': now.toISOString(),
      'showDeleted': false,
      'singleEvents': true,
      'maxResults': 50,
      'orderBy': 'startTime',
    });
    
    cachedEvents = response.result.items || [];
    const eventsEl = document.getElementById('events');
    if (!eventsEl) return;
    eventsEl.innerHTML = '';
    
    if (cachedEvents.length === 0) {
      eventsEl.innerHTML = '<div style="padding: 10px; opacity: 0.7;">No upcoming events found.</div>';
      return;
    }
    
    cachedEvents.forEach(event => {
      const start = event.start.dateTime || event.start.date;
      const startDate = new Date(start);
      const timeStr = startDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dayStr = startDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      const location = event.location ? event.location : 'No location specified';
      
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `
        <div class="event-time-container">
          <span class="event-time">${dayStr}</span>
          <span class="event-end-time">${timeStr}</span>
        </div>
        <div class="event-right">
          <div class="event-title">${event.summary || 'Untitled Event'}</div>
          <div class="event-location">📍 ${location}</div>
        </div>
      `;
      eventsEl.appendChild(div);
    });
  } catch (err) {
    console.error("Error loading calendar events", err);
    document.getElementById('auth-status').textContent = 'Error loading calendar events';
  }
}
</script>
<!-- Load Google API scripts safely -->
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
