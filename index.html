<style>
/* ===== MACOS PORTRAIT UI SYSTEM FOR FIRE HD 8 (800x1280) ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #f5f5f7;
  background-color: #1e1e1e;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image: url("background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Portrait Layout Grid: 2 Vertical Columns */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: brightness(0.85);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
  box-sizing: border-box;
}

/* macOS Frosted Glass Window Panel */
.macos-panel {
  background: rgba(30, 30, 30, 0.72);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  padding: 14px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
}

/* macOS Window Header dots */
.macos-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.window-dots {
  display: flex;
  gap: 5px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }

.panel-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}

/* ===== LEFT COLUMN: Clock, Weather, Markets ===== */
.column-left {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  min-width: 0;
}

/* Clock Panel */
.clock-panel {
  flex: 0 0 auto;
  align-items: center;
  text-align: center;
  padding: 12px;
}

#clock {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
  color: #ffffff;
}

#date {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 4px;
  font-weight: 500;
  text-transform: uppercase;
}

/* Weather Panel */
.weather-panel {
  flex: 1.2;
  min-height: 0;
  overflow-y: auto;
}

#weather-current {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#weather-forecast {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.weather-day {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 8px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
}

.weather-day:hover {
  background: rgba(255, 255, 255, 0.09);
}

.weather-name {
  font-weight: 600;
  width: 60px;
}

.weather-temp {
  font-weight: 700;
  color: #30d158;
  white-space: nowrap;
}

.weather-desc {
  color: rgba(255, 255, 255, 0.7);
  text-align: right;
  font-size: 10px;
  flex: 1;
  padding-left: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#weather-hourly {
  margin-top: 8px;
  font-size: 11px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 8px;
  padding: 10px;
  flex: 1; /* Expands to fill available space in the weather panel */
  min-height: 180px;
  overflow-y: auto;
  display: none;
  box-sizing: border-box;
}

.hourly-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.hourly-row:last-child { border-bottom: none; }

/* Markets / Stock Panel (SPY Real-Time) */
.stock-panel {
  flex: 1;
  min-height: 0;
  padding: 10px;
}

#tradingview-widget-container {
  width: 100%;
  height: 100%;
}


/* ===== RIGHT COLUMN: Large Quotes & Scrollable Calendar Cards ===== */
.column-right {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  min-width: 0;
}

/* Expanded Thought for the Day Panel */
.thought-panel {
  flex: 1.3;
  min-height: 0;
  overflow-y: auto;
}

#thought-container {
  width: 100%;
  height: calc(100% - 24px);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 16px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: left;
}

.thought-label {
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #30d158;
  margin-bottom: 8px;
}

#thought-text {
  font-size: 38px;
  line-height: 1.5;
  color: #ffffff;
  font-style: italic;
  font-weight: 400;
}

/* Calendar & Reminders Panel (Scrollable Card Container) */
.events-panel {
  flex: 1.7;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.auth-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

#auth-status {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.7);
}

.macos-btn {
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  cursor: pointer;
  transition: all 0.2s;
}

.macos-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

#events-container {
  flex: 1;
  max-height: 380px;
  overflow-y: auto;
  min-height: 0;
  padding-right: 4px;
}

/* Compact Event Card Style */
.event-item {
  margin-bottom: 6px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.event-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.event-time-container {
  display: flex;
  flex-direction: column;
  min-width: 65px;
}

.event-time {
  font-weight: 600;
  font-size: 11px;
  color: #30d158;
}

.event-end-time {
  font-size: 9px;
  color: rgba(255, 255, 255, 0.5);
}

.event-title {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.25;
}

.event-location {
  display: block;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 1px;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 4px;
}
</style>
</head>

<script>
// ===== CONFIGURATION =====
const CLIENT_ID = "703875968822-6ma5u7st5qm3eqgb1ktt9p52vs8knrb3.apps.googleusercontent.com";
const API_KEY = "AIzaSyCcx8q0nHP9DkA-M_KFyjFo-uLV-7TOrSE";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
const CALENDAR_ID = "family03331431524389313579@group.calendar.google.com";

const QUOTES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREcumm4p5A9G-506IZdhpDsBHZtbeHLiVMVbZJHLGFs6kkl3QPamiaOGmx1U8MADueTO-45bipj-wv/pub?output=csv";

// Global variables for voice reminders
let voiceEnabled = false;
let spokenEvents = new Set();
let cachedEvents = [];

// CSV Parser
function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  return lines.map(line => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  });
}

function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

// Fetch today's thought from published Google Sheet CSV
async function fetchAndDisplayTodayThought() {
  const now = new Date();
  const monthName = now.toLocaleString('en-US', { month: 'long' });
  const dayNum = now.getDate();
  const todayFormatted = `${monthName} ${dayNum}`;
  
  try {
    const response = await fetch(QUOTES_CSV_URL);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    
    if (rows.length < 2) throw new Error("CSV has no data rows");
    
    const dataRows = rows.slice(1).filter(r => r.length >= 2 && r[0]);
    let matchedRow = dataRows.find(r => r[0].toLowerCase() === todayFormatted.toLowerCase());
    
    if (!matchedRow) {
      const dayOfYear = getDayOfYear(now);
      const index = (dayOfYear - 1) % dataRows.length;
      matchedRow = dataRows[index];
    }
    
    if (matchedRow) {
      const dateCol = matchedRow[0];
      const principleCol = matchedRow[1] || '';
      const quoteCol = matchedRow[2] || matchedRow[1] || '';
      
      const titleElem = document.getElementById("thought-title");
      const textElem = document.getElementById("thought-text");
      
      if (principleCol && principleCol !== quoteCol) {
        titleElem.textContent = `${dateCol}: ${principleCol}`;
      } else {
        titleElem.textContent = `Napoleon Hill — ${dateCol}`;
      }
      
      textElem.textContent = `"${quoteCol}"`;
    }
  } catch (error) {
    console.error("Error fetching quotes CSV:", error);
    document.getElementById("thought-text").textContent = `"Whatever the mind can conceive and believe, it can achieve." — Napoleon Hill`;
  }
}

// ===== CLOCK & DATE =====
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  });
  document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}

setInterval(updateClock, 1000);
updateClock();
fetchAndDisplayTodayThought();

// ===== DUAL TEMPERATURE FORMATTER (°C & °F) =====
function formatTempDual(tempC) {
  if (tempC === undefined || tempC === null || isNaN(tempC)) return "--°C / --°F";
  const c = Math.round(tempC);
  const f = Math.round((tempC * 9/5) + 32);
  return `${c}°C / ${f}°F`;
}

// ===== WEATHER LOGIC =====
const mockForecastData = [
  { name: "Today", tempC: 21, desc: "Sunny & Clear", hourly: generateTodayHourly(21) },
  { name: "Tomorrow", tempC: 23, desc: "Mostly Sunny", hourly: generateFull24HourHourly(23) },
  { name: "Wednesday", tempC: 19, desc: "Partly Cloudy", hourly: generateFull24HourHourly(19) },
  { name: "Thursday", tempC: 18, desc: "Light Showers", hourly: generateFull24HourHourly(18) },
  { name: "Friday", tempC: 20, desc: "Clear Skies", hourly: generateFull24HourHourly(20) },
  { name: "Saturday", tempC: 22, desc: "Warm & Sunny", hourly: generateFull24HourHourly(22) },
  { name: "Sunday", tempC: 17, desc: "Breezy", hourly: generateFull24HourHourly(17) }
];

function generateTodayHourly(baseTemp) {
  const hours = [];
  const currentHour = new Date().getHours();
  for (let hr = currentHour; hr < 24; hr++) {
    const ampm = hr >= 12 ? 'PM' : 'AM';
    const formattedHr = hr % 12 === 0 ? 12 : hr % 12;
    const tempVar = baseTemp + Math.round(Math.sin((hr / 24) * 2 * Math.PI) * 4);
    hours.push({ time: `${formattedHr} ${ampm}`, temp: tempVar });
  }
  return hours;
}

function generateFull24HourHourly(baseTemp) {
  const hours = [];
  for (let hr = 0; hr < 24; hr++) {
    const ampm = hr >= 12 ? 'PM' : 'AM';
    const formattedHr = hr % 12 === 0 ? 12 : hr % 12;
    const tempVar = baseTemp + Math.round(Math.sin((hr / 24) * 2 * Math.PI) * 4);
    hours.push({ time: `${formattedHr} ${ampm}`, temp: tempVar });
  }
  return hours;
}

function initWeather() {
  document.getElementById("weather-current").innerHTML = `<span>Current</span> <span>${formatTempDual(21)} ☀️</span>`;
  const forecastContainer = document.getElementById("weather-forecast");
  forecastContainer.innerHTML = "";
  
  mockForecastData.forEach((day, index) => {
    const dayDiv = document.createElement("div");
    dayDiv.className = "weather-day";
    dayDiv.innerHTML = `
      <span class="weather-name">${day.name}</span>
      <span class="weather-temp">${formatTempDual(day.tempC)}</span>
      <span class="weather-desc">${day.desc}</span>
    `;
    dayDiv.onclick = () => showHourlyDetail(index);
    forecastContainer.appendChild(dayDiv);
  });
}

function showHourlyDetail(dayIndex) {
  const dayData = mockForecastData[dayIndex];
  const hourlyContainer = document.getElementById("weather-hourly");
  
  let html = `<div style="font-weight:600; margin-bottom:6px; color:#30d158;">Hourly Forecast for ${dayData.name}:</div>`;
  dayData.hourly.forEach(h => {
    html += `<div class="hourly-row"><span>${h.time}</span><span>${formatTempDual(h.temp)}</span></div>`;
  });
  
  hourlyContainer.innerHTML = html;
  hourlyContainer.style.display = "block";
}

initWeather();

// ===== GOOGLE CALENDAR AUTH, FETCH & VOICE REMINDERS =====
let tokenClient;
let gapiInited = false;
let gsisInited = false;

function gapiLoaded() {
  gapi.load('client', initializeGapiClient);
}

async function initializeGapiClient() {
  await gapi.client.init({
    apiKey: API_KEY,
    discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
  });
  gapiInited = true;
  maybeEnableSignIn();
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: '',
  });
  gsisInited = true;
  maybeEnableSignIn();
}

function maybeEnableSignIn() {
  if (gapiInited && gsisInited) {
    document.getElementById('sign-in').removeAttribute('disabled');
    document.getElementById('auth-status').textContent = 'Signed out';
  }
}

document.getElementById('sign-in').onclick = () => {
  tokenClient.callback = async (resp) => {
    if (resp.error !== undefined) {
      throw (resp);
    }
    document.getElementById('auth-status').textContent = 'Connected';
    document.getElementById('sign-in').textContent = 'Refresh';
    await listUpcomingEvents();
    setInterval(listUpcomingEvents, 15 * 60 * 1000);
  };

  if (gapi.client.getToken() === null) {
    tokenClient.requestAccessToken({prompt: 'consent'});
  } else {
    tokenClient.requestAccessToken({prompt: ''});
  }
};

// Voice Alerts Setup
document.getElementById('enable-voice').onclick = () => {
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById('enable-voice');
  if (voiceEnabled) {
    btn.style.background = '#30d158';
    btn.style.color = '#000';
    speak("Voice alerts enabled. I will notify you 30 minutes before your events.");
  } else {
    btn.style.background = 'rgba(255, 255, 255, 0.1)';
    btn.style.color = '#fff';
    speak("Voice alerts disabled.");
  }
};

function speak(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utterance);
  }
}

setInterval(() => {
  if (!voiceEnabled || cachedEvents.length === 0) return;
  const now = new Date();
  
  cachedEvents.forEach(event => {
    const startStr = event.start.dateTime || event.start.date;
    const startTime = new Date(startStr);
    const diffMinutes = (startTime - now) / (1000 * 60);
    
    if (diffMinutes >= 29 && diffMinutes <= 31 && !spokenEvents.has(event.id)) {
      speak(`Reminder: ${event.summary} starts in 30 minutes.`);
      spokenEvents.add(event.id);
    }
  });
}, 30000);

async function listUpcomingEvents() {
  try {
    const now = new Date();

    const response = await gapi.client.calendar.events.list({
      'calendarId': CALENDAR_ID,
      'timeMin': now.toISOString(),
      'showDeleted': false,
      'singleEvents': true,
      'maxResults': 250,
      'orderBy': 'startTime',
    });
    
    cachedEvents = response.result.items;
    const eventsEl = document.getElementById('events');
    eventsEl.innerHTML = '';
    
    if (!cachedEvents || cachedEvents.length === 0) {
      eventsEl.innerHTML = '<div style="padding:10px; font-size:11px; opacity:0.7;">No upcoming events found.</div>';
      return;
    }
    
    cachedEvents.forEach(event => {
      const start = event.start.dateTime || event.start.date;
      const startDate = new Date(start);
      const timeStr = startDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dayStr = startDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      const location = event.location ? event.location : 'No location specified';
      
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `
        <div class="event-header-row">
          <div class="event-time-container">
            <span class="event-time">${dayStr}</span>
            <span class="event-end-time">${timeStr}</span>
          </div>
          <div class="event-title">${event.summary}</div>
        </div>
        <div class="event-location">📍 ${location}</div>
      `;
      eventsEl.appendChild(div);
    });
  } catch (err) {
    console.error("Error loading calendar events", err);
    document.getElementById('auth-status').textContent = 'Error loading calendar';
  }
}
