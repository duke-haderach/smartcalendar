<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wall Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- COOP Header Fix for Google OAuth Popups -->
<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
<meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />

<!-- Google APIs -->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
/* ===== EXACT VIEWPORT & RESET ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #ffffff;
  background-color: #1e1e1e;
  overflow: hidden;
}

body {
  background-image: url("background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* PORTRAIT TWO-COLUMN LAYOUT */
.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(0,0,0,0.4), rgba(0,0,0,0.88));
  display: flex;
  flex-direction: row;
  padding: 12px;
  box-sizing: border-box;
  gap: 12px;
}

/* macOS Frosted Glass Panel Base */
.macos-panel {
  background: rgba(30, 30, 30, 0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  padding: 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  overflow: hidden;
}

/* macOS Header Dots */
.macos-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.window-dots {
  display: flex;
  gap: 4px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }

.panel-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}

/* ===== LEFT COLUMN (Clock 20%, Weather 50%, Markets 30%) ===== */
.column-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  min-width: 0;
}

.clock-panel {
  flex: 0 0 10%;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#clock {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.1;
}

#date {
  font-size: 13px;
  opacity: 0.8;
  margin-top: 4px;
  font-weight: 500;
  text-transform: uppercase;
}

.weather-panel {
  flex: 0 0 60%;
  min-height: 0;
  overflow-y: auto;
}

#weather-current {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#weather-forecast {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.weather-day {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 8px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s;
}

.weather-day:hover {
  background: rgba(255, 255, 255, 0.1);
}

.weather-name {
  font-weight: 600;
  width: 70px;
}

.weather-temp {
  font-weight: 600;
  color: #30d158;
}

.weather-desc {
  opacity: 0.8;
  text-align: right;
  flex: 1;
  padding-left: 8px;
  font-size: 11px;
}

#weather-hourly {
  margin-top: 6px;
  font-size: 11px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 6px;
  padding: 6px;
  max-height: 300px;
  overflow-y: auto;
  display: none;
}

.hourly-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 4px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.hourly-row:last-child { border-bottom: none; }

.stock-panel {
  flex: 0 0 30%;
  min-height: 0;
}

#tradingview-widget-container {
  width: 100%;
  height: 100%;
}


/* ===== RIGHT COLUMN (Quote 40%, Events 60%) ===== */
.column-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  min-width: 0;
}

.thought-panel {
  flex: 0 0 40%;
  min-height: 0;
  overflow-y: auto;
}

#thought-container {
  width: 100%;
  height: calc(100% - 20px);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.thought-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #30d158;
  margin-bottom: 4px;
}

#thought-text {
  font-size: 22px;
  line-height: 1.35;
  color: #ffffff;
  font-style: italic;
}

.events-panel {
  flex: 0 0 60%;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.auth-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

#auth-status {
  font-size: 12px;
  opacity: 0.8;
}

.macos-btn {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  cursor: pointer;
  transition: all 0.2s;
}

.macos-btn:hover {
  background: rgba(255, 255, 255, 0.25);
}

#events-container {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

#events {
  flex: 1;
  overflow-y: auto;
}

.event-item {
  margin-bottom: 6px;
  padding: 8px 10px;
  background: rgba(0, 255, 0, 0.05);
  border: 1px solid rgba(0, 255, 0, 0.15);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-left: 3px solid #30d158;
}

.event-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.event-time-container {
  display: flex;
  flex-direction: column;
  min-width: 70px;
}

.event-time {
  font-weight: 600;
  font-size: 12px;
  color: #30d158;
}

.event-end-time {
  font-size: 10px;
  opacity: 0.7;
}

.event-title {
  flex: 1;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.2;
}

.event-location {
  display: block;
  font-size: 11px;
  opacity: 0.8;
  margin-top: 2px;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px;
}
</style>
</head>
<body>
<div class="overlay">
  <!-- LEFT COLUMN -->
  <div class="column-left">
    <!-- Clock Panel -->
    <div class="macos-panel clock-panel">
      <div class="macos-header" style="width:100%;">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">System Time</div>
        <div style="width: 20px;"></div>
      </div>
      <div id="clock">--:-- --</div>
      <div id="date">Loading date…</div>
    </div>

    <!-- Weather Panel -->
    <div class="macos-panel weather-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Weather (°C / °F)</div>
        <div style="width: 20px;"></div>
      </div>
      <div id="weather-current">Loading live weather…</div>
      <div id="weather-forecast"></div>
      <div id="weather-hourly"></div>
    </div>

    <!-- Markets Panel (SPY) -->
    <div class="macos-panel stock-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Markets (SPY)</div>
        <div style="width: 20px;"></div>
      </div>
      <div id="tradingview-widget-container" style="width:100%;height:100%;">
        <iframe src="https://s.tradingview.com/embed-widget/mini-symbol-overview/?locale=en#%7B%22symbol%22%3A%22AMEX%3ASPY%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A%22100%25%22%2C%22dateRange%22%3A%221D%22%2C%22colorTheme%22%3A%22dark%22%2C%22isTransparent%22%3Atrue%2C%22autosize%22%3Atrue%7D" style="width:100%; height:100%; border:none;" scrolling="no"></iframe>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="column-right">
    <!-- Thought for the Day Panel -->
    <div class="macos-panel thought-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Thought for the Day</div>
        <div style="width: 20px;"></div>
      </div>
      <div id="thought-container">
        <div class="thought-label" id="thought-title">Napoleon Hill</div>
        <div id="thought-text">Fetching today's wisdom...</div>
      </div>
    </div>

    <!-- Calendar & Reminders Panel -->
    <div class="macos-panel events-panel">
      <div class="macos-header">
        <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="panel-title">Calendar & Reminders</div>
        <div style="width: 20px;"></div>
      </div>
      <div class="auth-bar">
        <span id="auth-status">Initializing...</span>
        <div>
          <button id="sign-in" class="macos-btn" disabled>Loading...</button>
          <button id="enable-voice" class="macos-btn">Voice</button>
        </div>
      </div>
      <div id="events-container">
        <div id="events"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== CONFIGURATION =====
const CLIENT_ID = "703875968822-6ma5u7st5qm3eqgb1ktt9p52vs8knrb3.apps.googleusercontent.com";
const API_KEY = "AIzaSyCcx8q0nHP9DkA-M_KFyjFo-uLV-7TOrSE";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
const CALENDAR_ID = "family03331431524389313579@group.calendar.google.com";

const QUOTES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREcumm4p5A9G-506IZdhpDsBHZtbeHLiVMVbZJHLGFs6kkl3QPamiaOGmx1U8MADueTO-45bipj-wv/pub?output=csv";

let tokenClient = null;
let gapiInited = false;
let gsisInited = false;
let cachedEvents = [];
let voiceEnabled = false;
let activeHourlyIndex = null;
let liveWeatherData = null;

// ===== 1. CLOCK & DATE (Guaranteed to run instantly) =====
function updateClock() {
  try {
    const now = new Date();
    const clockEl = document.getElementById("clock");
    const dateEl = document.getElementById("date");
    if (clockEl) {
      clockEl.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: true });
    }
    if (dateEl) {
      dateEl.textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    }
  } catch (e) {
    console.error("Clock error:", e);
  }
}
setInterval(updateClock, 1000);
updateClock();

// ===== 2. THOUGHT FOR THE DAY =====
function parseCSV(text) {
  try {
    const lines = text.split(/\r?\n/);
    return lines.map(line => {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    });
  } catch(e) {
    return [];
  }
}

function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

async function fetchAndDisplayTodayThought() {
  const fallbackQuote = `"Whatever the mind can conceive and believe, it can achieve." — Napoleon Hill`;
  try {
    const response = await fetch(QUOTES_CSV_URL);
    if (!response.ok) throw new Error("Network response failed");
    
    const csvText = await response.text();
    const rows = parseCSV(csvText);
    if (rows.length < 2) throw new Error("Empty CSV");
    
    const now = new Date();
    const monthName = now.toLocaleString('en-US', { month: 'long' });
    const dayNum = now.getDate();
    const todayFormatted = `${monthName} ${dayNum}`;
    
    const dataRows = rows.slice(1).filter(r => r.length >= 2 && r[0]);
    let matchedRow = dataRows.find(r => r[0].toLowerCase() === todayFormatted.toLowerCase());
    
    if (!matchedRow) {
      const dayOfYear = getDayOfYear(now);
      const index = (dayOfYear - 1) % dataRows.length;
      matchedRow = dataRows[index];
    }
    
    if (matchedRow) {
      const dateCol = matchedRow[0];
      const principleCol = matchedRow[1] || '';
      const quoteCol = matchedRow[2] || matchedRow[1] || '';
      
      const titleElem = document.getElementById("thought-title");
      const textElem = document.getElementById("thought-text");
      
      if (titleElem && textElem) {
        titleElem.textContent = (principleCol && principleCol !== quoteCol) ? `${dateCol}: ${principleCol}` : `Napoleon Hill — ${dateCol}`;
        textElem.textContent = `"${quoteCol}"`;
      }
    } else {
      throw new Error("No match");
    }
  } catch (error) {
    console.warn("Using fallback quote:", error);
    const textElem = document.getElementById("thought-text");
    if (textElem) textElem.textContent = fallbackQuote;
  }
}
fetchAndDisplayTodayThought();

// ===== 3. REAL-TIME WEATHER (Open-Meteo API) =====
function formatTempDual(tempC) {
  if (tempC === undefined || tempC === null || isNaN(tempC)) return "--°C / --°F";
  const c = Math.round(tempC);
  const f = Math.round((tempC * 9/5) + 32);
  return `${c}°C / ${f}°F`;
}

function getWeatherDescription(code) {
  const weatherCodes = {
    0: "Clear Sky ☀️",
    1: "Mainly Clear 🌤️",
    2: "Partly Cloudy ⛅",
    3: "Overcast ☁️",
    45: "Foggy 🌫️",
    51: "Light Drizzle 🌦️",
    61: "Rain Showers 🌧️",
    71: "Snowfall ❄️",
    95: "Thunderstorm ⚡"
  };
  return weatherCodes[code] || "Fair 🌤️";
}

async function fetchLiveWeather() {
  try {
    const lat = 43.6532; // Default coordinates (Mississauga/Toronto area)
    const lon = -79.3832;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
    
    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather fetch failed");
    const data = await response.json();
    liveWeatherData = data;
    
    const currentTemp = data.current.temperature_2m;
    const currentWeatherCode = data.current.weather_code;
    const currentEl = document.getElementById("weather-current");
    if (currentEl) {
      currentEl.innerHTML = `<span>Current</span> <span>${formatTempDual(currentTemp)} ${getWeatherDescription(currentWeatherCode)}</span>`;
    }
    
    const forecastContainer = document.getElementById("weather-forecast");
    if (!forecastContainer) return;
    forecastContainer.innerHTML = "";
    
    const dailyTimes = data.daily.time;
    dailyTimes.forEach((dateStr, index) => {
      const d = new Date(dateStr + "T00:00:00");
      const dayName = (index === 0) ? "Today" : d.toLocaleDateString('en-US', { weekday: 'long' });
      const maxTemp = data.daily.temperature_2m_max[index];
      const code = data.daily.weather_code[index];
      
      const dayDiv = document.createElement("div");
      dayDiv.className = "weather-day";
      dayDiv.innerHTML = `
        <span class="weather-name">${dayName}</span>
        <span class="weather-temp">${formatTempDual(maxTemp)}</span>
        <span class="weather-desc">${getWeatherDescription(code)}</span>
      `;
      dayDiv.onclick = () => toggleHourlyDetail(index, dayName);
      forecastContainer.appendChild(dayDiv);
    });
  } catch (err) {
    console.error("Live weather error:", err);
    document.getElementById("weather-current").textContent = "Weather unavailable";
  }
}

function toggleHourlyDetail(dayIndex, dayName) {
  const hourlyContainer = document.getElementById("weather-hourly");
  if (!hourlyContainer || !liveWeatherData) return;
  
  if (activeHourlyIndex === dayIndex) {
    hourlyContainer.style.display = "none";
    activeHourlyIndex = null;
    return;
  }
  
  activeHourlyIndex = dayIndex;
  
  const startIndex = dayIndex * 24;
  const endIndex = startIndex + 24;
  const hourlyTimes = liveWeatherData.hourly.time.slice(startIndex, endIndex);
  const hourlyTemps = liveWeatherData.hourly.temperature_2m.slice(startIndex, endIndex);
  
  let html = `<div style="font-weight:600; margin-bottom:4px; color:#30d158;">Hourly for ${dayName}:</div>`;
  const currentHour = new Date().getHours();
  
  hourlyTimes.forEach((timeStr, i) => {
    const hrDate = new Date(timeStr);
    const hr = hrDate.getHours();
    
    if (dayIndex !== 0 || hr >= currentHour) {
      const ampm = hr >= 12 ? 'PM' : 'AM';
      const formattedHr = hr % 12 === 0 ? 12 : hr % 12;
      html += `<div class="hourly-row"><span>${formattedHr} ${ampm}</span><span>${formatTempDual(hourlyTemps[i])}</span></div>`;
    }
  });
  
  hourlyContainer.innerHTML = html;
  hourlyContainer.style.display = "block";
}

fetchLiveWeather();
setInterval(fetchLiveWeather, 30 * 60 * 1000);

// ===== 4. GOOGLE CALENDAR GAPI & GIS SETUP =====
function gapiLoaded() {
  try {
    if (typeof gapi !== 'undefined') {
      gapi.load('client', initializeGapiClient);
    }
  } catch (e) {
    console.error("gapiLoaded error:", e);
  }
}

async function initializeGapiClient() {
  try {
    await gapi.client.init({
      apiKey: API_KEY,
      discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
    });
    gapiInited = true;
    maybeEnableSignIn();
  } catch (err) {
    console.error("GAPI init error:", err);
  }
}

function gisLoaded() {
  try {
    if (typeof google !== 'undefined' && google.accounts) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error !== undefined) {
            console.error("Auth error:", resp);
            document.getElementById('auth-status').textContent = 'Sign-in failed';
            return;
          }
          document.getElementById('auth-status').textContent = 'Connected';
          document.getElementById('sign-in').textContent = 'Refresh';
          listUpcomingEvents();
          setInterval(listUpcomingEvents, 15 * 60 * 1000);
        },
      });
      gsisInited = true;
      maybeEnableSignIn();
    }
  } catch (e) {
    console.error("gisLoaded error:", e);
  }
}

function maybeEnableSignIn() {
  const signInBtn = document.getElementById('sign-in');
  const authStatus = document.getElementById('auth-status');
  if (gapiInited && gsisInited && signInBtn) {
    signInBtn.removeAttribute('disabled');
    signInBtn.textContent = 'Sign In';
    if (authStatus) authStatus.textContent = 'Signed out';
  }
}

const signInBtn = document.getElementById('sign-in');
if (signInBtn) {
  signInBtn.onclick = () => {
    try {
      if (!tokenClient) {
        document.getElementById('auth-status').textContent = 'Auth initializing...';
        return;
      }
      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({prompt: 'consent'});
      } else {
        tokenClient.requestAccessToken({prompt: ''});
      }
    } catch (err) {
      console.error("Token request error:", err);
    }
  };
}

const voiceBtn = document.getElementById('enable-voice');
if (voiceBtn) {
  voiceBtn.onclick = () => {
    voiceEnabled = !voiceEnabled;
    voiceBtn.style.background = voiceEnabled ? '#30d158' : 'rgba(255,255,255,0.1)';
    voiceBtn.style.color = voiceEnabled ? '#000' : '#fff';
    speak(voiceEnabled ? "Voice alerts enabled." : "Voice alerts disabled.");
  };
}

function speak(text) {
  try {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(utterance);
    }
  } catch (e) {}
}

setInterval(() => {
  if (!voiceEnabled || cachedEvents.length === 0) return;
  const now = new Date();
  cachedEvents.forEach(event => {
    if (!event.start) return;
    const startStr = event.start.dateTime || event.start.date;
    const startTime = new Date(startStr);
    const diffMinutes = (startTime - now) / (1000 * 60);
    if (diffMinutes >= 29 && diffMinutes <= 31 && !spokenEvents.has(event.id)) {
      speak(`Reminder: ${event.summary} starts in 30 minutes.`);
      spokenEvents.add(event.id);
    }
  });
}, 30000);

async function listUpcomingEvents() {
  try {
    const now = new Date();
    const response = await gapi.client.calendar.events.list({
      'calendarId': CALENDAR_ID,
      'timeMin': now.toISOString(),
      'showDeleted': false,
      'singleEvents': true,
      'maxResults': 250,
      'orderBy': 'startTime',
    });
    
    cachedEvents = response.result.items || [];
    const eventsEl = document.getElementById('events');
    if (!eventsEl) return;
    eventsEl.innerHTML = '';
    
    if (cachedEvents.length === 0) {
      eventsEl.innerHTML = '<div style="padding: 10px; opacity: 0.7; font-size: 12px;">No upcoming events found.</div>';
      return;
    }
    
    cachedEvents.forEach(event => {
      const start = event.start.dateTime || event.start.date;
      const startDate = new Date(start);
      const timeStr = startDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dayStr = startDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      const location = event.location ? event.location : 'No location specified';
      
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `
        <div class="event-header-row">
          <div class="event-time-container">
            <span class="event-time">${dayStr}</span>
            <span class="event-end-time">${timeStr}</span>
          </div>
          <div class="event-title">${event.summary || 'Untitled Event'}</div>
        </div>
        <div class="event-location">📍 ${location}</div>
      `;
      eventsEl.appendChild(div);
    });
  } catch (err) {
    console.error("Error loading calendar events", err);
    document.getElementById('events').innerHTML = '<div style="padding: 10px; font-size: 12px; color: #ff5f56;">Error loading calendar events.</div>';
    document.getElementById('auth-status').textContent = 'Error loading calendar';
  }
}
</script>
